# Baut die App bei jedem Push und Pull Request:
#  - Tests (Robolectric) und Lint
#  - Debug-APK zum Herunterladen (Artefakt "globeswap-debug-apk")
#  - Signierte Release-APK und App-Bundle (Artefakt "globeswap-release-…"), sobald die
#    Secrets SIGNING_KEYSTORE_BASE64 und SIGNING_PASSWORD im Repository hinterlegt sind.
#  - Bei einem Tag wie v1.4 oder per "Run workflow" mit Versionsnummer: GitHub-Release mit der
#    signierten APK zum Herunterladen (Version "1.4" kommt aus Tag bzw. Eingabe).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Version für ein GitHub-Release, z. B. 1.4 (leer lassen = nur bauen)"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      signed: ${{ steps.signed.outputs.signed }}
      artifact: globeswap-release-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      # versionCode = 100 + Build-Nummer: steigt mit jedem Build, damit jedes App-Bundle bei Google
      # hochgeladen werden kann. Gradle liest ihn aus GLOBESWAP_VERSION_CODE.
      - name: Versionsnummer
        id: version
        env:
          RELEASE_INPUT: ${{ github.event.inputs.release }}
        run: |
          code=$((100 + GITHUB_RUN_NUMBER))
          if [[ -n "$RELEASE_INPUT" ]]; then
            if [[ ! "$RELEASE_INPUT" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
              echo "::error::Ungültige Versionsnummer '$RELEASE_INPUT' – erwartet z. B. 1.4"; exit 1
            fi
            name="$RELEASE_INPUT"
            echo "GLOBESWAP_VERSION_NAME=$name" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^v[0-9] ]]; then
            name="${GITHUB_REF_NAME#v}"
            echo "GLOBESWAP_VERSION_NAME=$name" >> "$GITHUB_ENV"
          else
            name=$(sed -n 's/.*?: "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          fi
          echo "GLOBESWAP_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "### GlobeSwap $name (versionCode $code)" >> "$GITHUB_STEP_SUMMARY"
          echo "Version $name, versionCode $code"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintRelease

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v7
        with:
          name: globeswap-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Testberichte und Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.html
            app/build/outputs/roborazzi/
            app/build/outputs/store-raw/
          retention-days: 14
          if-no-files-found: ignore

      # Release nur, wenn der Signaturschlüssel als Secret hinterlegt ist (nicht bei Pull Requests von außen).
      - name: Signaturschlüssel bereitstellen
        if: env.SIGNING_KEYSTORE_BASE64 != '' && env.SIGNING_PASSWORD != ''
        run: |
          mkdir -p signing
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > signing/photoswap-release.jks
          cat > signing/keystore.properties <<PROPS
          storeFile=../signing/photoswap-release.jks
          storePassword=$SIGNING_PASSWORD
          keyAlias=photoswap
          keyPassword=$SIGNING_PASSWORD
          PROPS

      - name: Release bauen (APK + App-Bundle)
        if: env.SIGNING_KEYSTORE_BASE64 != '' && env.SIGNING_PASSWORD != ''
        run: ./gradlew assembleRelease bundleRelease

      # Öffentlicher Fingerabdruck des Zertifikats: zeigt, mit welchem Schlüssel signiert wurde
      # (muss zum Upload-Schlüssel in der Play Console passen). Enthält nichts Geheimes.
      - name: Signatur prüfen
        if: env.SIGNING_KEYSTORE_BASE64 != '' && env.SIGNING_PASSWORD != ''
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          fp=$("$apksigner" verify --print-certs app/build/outputs/apk/release/*.apk | sed -n 's/.*SHA-256 digest: //p' | head -1)
          echo "::notice title=Signatur-Zertifikat (SHA-256)::$fp"
          echo "Zertifikat SHA-256: \`$fp\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$fp" > app/build/outputs/apk/release/certificate-sha256.txt

      - name: APK für Downloads benennen
        id: signed
        if: env.SIGNING_KEYSTORE_BASE64 != '' && env.SIGNING_PASSWORD != ''
        run: |
          cd app/build/outputs/apk/release
          cp app-release.apk "GlobeSwap-${{ steps.version.outputs.name }}.apk"
          sha256sum "GlobeSwap-${{ steps.version.outputs.name }}.apk" > SHA256SUMS.txt
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Release hochladen
        if: env.SIGNING_KEYSTORE_BASE64 != '' && env.SIGNING_PASSWORD != ''
        uses: actions/upload-artifact@v7
        with:
          name: globeswap-release-${{ steps.version.outputs.name }}-${{ env.GLOBESWAP_VERSION_CODE }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.txt
            app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Signaturschlüssel entfernen
        if: always()
        run: rm -rf signing

      - name: Hinweis ohne Signaturschlüssel
        if: env.SIGNING_KEYSTORE_BASE64 == '' || env.SIGNING_PASSWORD == ''
        run: echo "::notice::Kein Signaturschlüssel hinterlegt – Release-Build übersprungen (siehe README, Abschnitt 'Automatische Builds')."

  # Bei einem Tag wie v1.4: GitHub-Release mit der signierten APK (nur wenn signiert gebaut wurde).
  release:
    if: >-
      needs.build.outputs.signed == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release != ''))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Release-Text
        run: |
          cert=$(cat dist/apk/release/certificate-sha256.txt)
          sum=$(cut -d' ' -f1 dist/apk/release/SHA256SUMS.txt)
          cat > notes.md <<NOTES
          ## GlobeSwap ${{ needs.build.outputs.version }}

          Swap photos with strangers around the world.

          ### Install
          1. Download **GlobeSwap-${{ needs.build.outputs.version }}.apk** below on your Android phone (Android 10 or newer).
          2. Open it and allow installing apps from this source when Android asks.

          Installed from Google Play already? Keep using that version – updates from GitHub and Google Play can't be mixed.

          ### Verify
          - APK SHA-256: \`$sum\`
          - Signing certificate SHA-256: \`$cert\`
          - versionCode ${{ needs.build.outputs.code }}
          NOTES
          sed -i 's/^          //' notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: GlobeSwap ${{ needs.build.outputs.version }}
          body_path: notes.md
          files: |
            dist/apk/release/GlobeSwap-*.apk
            dist/apk/release/SHA256SUMS.txt
