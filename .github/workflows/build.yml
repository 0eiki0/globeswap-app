# Baut die App bei jedem Push und Pull Request:
#  - Tests (Robolectric) und Lint
#  - Debug-APK zum Herunterladen (Artefakt "globeswap-debug-apk")
#  - Signierte Release-APK und App-Bundle (Artefakt "globeswap-release"), sobald die
#    Secrets SIGNING_KEYSTORE_BASE64 und SIGNING_PASSWORD im Repository hinterlegt sind.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintRelease

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: globeswap-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Testberichte und Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.html
            app/build/outputs/roborazzi/
            app/build/outputs/store-raw/
          retention-days: 14
          if-no-files-found: ignore

      # Release nur, wenn der Signaturschlüssel als Secret hinterlegt ist (nicht bei Pull Requests von außen).
      - name: Signaturschlüssel bereitstellen
        if: env.SIGNING_KEYSTORE_BASE64 != '' && env.SIGNING_PASSWORD != ''
        run: |
          mkdir -p signing
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > signing/photoswap-release.jks
          cat > signing/keystore.properties <<PROPS
          storeFile=../signing/photoswap-release.jks
          storePassword=$SIGNING_PASSWORD
          keyAlias=photoswap
          keyPassword=$SIGNING_PASSWORD
          PROPS

      - name: Release bauen (APK + App-Bundle)
        if: env.SIGNING_KEYSTORE_BASE64 != '' && env.SIGNING_PASSWORD != ''
        run: ./gradlew assembleRelease bundleRelease

      - name: Release hochladen
        if: env.SIGNING_KEYSTORE_BASE64 != '' && env.SIGNING_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: globeswap-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Signaturschlüssel entfernen
        if: always()
        run: rm -rf signing

      - name: Hinweis ohne Signaturschlüssel
        if: env.SIGNING_KEYSTORE_BASE64 == '' || env.SIGNING_PASSWORD == ''
        run: echo "::notice::Kein Signaturschlüssel hinterlegt – Release-Build übersprungen (siehe README, Abschnitt 'Automatische Builds')."
